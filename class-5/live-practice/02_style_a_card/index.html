<!--
Live practice 2: Change the style (10 minutes)
------------------------------------------------------------
TOPICS: color, background, font-size, border-radius

PROBLEM
The HTML and style.css are both done. Open index.html in the browser,
then change values in style.css. After each change: save, refresh.
  1. body: change the background colour of the page.
  2. h3: change the colour and the font-size.
  3. button: change the background colour.
  4. .card: change the border-radius (try 0px, then 30px).

TIP
  Try each value in DevTools (Inspect, Styles panel) before you write it.
  Colours: names (tomato, teal) or hex codes (#2563eb).

EXPECTED OUTPUT
  The same two cards, but with your own colours and sizes.
------------------------------------------------------------
-->
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Style a card</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="row">
      <div class="card">
        <h3>Logo design</h3>
        <p>A simple logo for your brand.</p>
        <button>Order</button>
      </div>
      <div class="card">
        <h3>Website</h3>
        <p>A clean one-page site.</p>
        <button>Order</button>
      </div>
    </div>
  </body>
</html>
