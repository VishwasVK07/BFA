<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Faisal K | Links</title>
  </head>
  <body>
    <main class="page">
      <div class="top-bar">
        <button id="theme-btn" type="button">Dark mode</button>
      </div>

      <article class="card">
        <header class="profile">
          <img class="avatar" src="images/avatar.svg" alt="Photo of Faisal K" />
          <h1>Faisal K</h1>
          <h2 class="role">Aspiring full-stack developer</h2>
          <p class="bio">Learning to build web apps. Based in Toronto.</p>

        <nav>
          <ul class="links">
            <li>
              <a class="link" href="https://www.linkedin.com/" target="_blank" rel="noopener">
                <img src="images/linkedin.svg" alt="" />
                <span>LinkedIn</span>
              </a>
            </li>
            <li>
              <a class="link" href="https://github.com/" target="_blank" rel="noopener">
                <img src="images/github.svg" alt="" />
                <span>GitHub</span>
              </a>
            </li>
            <li>
              <a class="link" href="https://www.instagram.com/" target="_blank" rel="noopener">
                <img src="images/instagram.svg" alt="" />
                <span>Instagram</span>
              </a>
            </li>
            <li>
              <a class="link" href="mailto:you@example.com">
                <img src="images/email.svg" alt="" />
                <span>Email me</span>
              </a>
            </li>
          </ul>
        </nav>

        <footer class="footer">
          <p>Made in <strong>Class 5</strong> with <em>HTML, CSS and JavaScript</em>.</p>
        </footer>
      </article>
    </main>

</html>
