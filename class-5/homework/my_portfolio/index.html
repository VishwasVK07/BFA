<!--
HOMEWORK: Build your own portfolio, in 3 steps (one site, one folder)
------------------------------------------------------------
A portfolio is a page about you: who you are, what you made, how to reach you.
Three files in this folder: index.html, style.css, script.js.
Look at docs/lecture/04_javascript if you get stuck, but type your own.

HOMEWORK 1: HTML (30 minutes). Work only in this file.
  Sections: a header with your name and menu, About, Projects (2 or 3), Contact.
  Use EVERY tag below at least once, with your own content:
  [ ] <header>, <nav>, <main>, <section>, <article>, <footer>
  [ ] <h1>, <h2>, <h3>, <p>
  [ ] <img src="..." alt="...">          your photo (put it in images/)
  [ ] <ul> and <li>                      your skills or your menu
  [ ] <a href="...">                     menu links (href="#about") and your real links
  [ ] <span>, <strong>, <em>
  [ ] <button>                           a button (we use it in step 3)
  Check: no red errors in the Console, every <img> has an alt.

HOMEWORK 2: CSS (30 minutes). Work in style.css (already linked below).
  [ ] :root variables for 3 colours, used with var(...)
  [ ] body: font-family, background colour, margin: 0
  [ ] header: display flex, space between name and menu
  [ ] each project card: background, padding, border, border-radius
  [ ] your photo: width, height, border-radius: 50%, object-fit: cover
  [ ] links and buttons: colour, :hover
  [ ] main: max-width and margin: 0 auto, so it sits in the middle
  Try each value in DevTools first, then write it.

HOMEWORK 3: dark mode button (20 minutes). Work in script.js.
  [ ] In style.css: add body.dark with new colour variables
  [ ] In script.js: find the button, listen for a click,
      document.body.classList.toggle("dark")
  [ ] The text is readable in both modes

When done: push the folder to your GitHub repo. We rebuild it in React in Class 6.

RULES
  Ask AI to explain a line or an error, then type it yourself.
  Simple and working beats big and broken.
------------------------------------------------------------
-->
